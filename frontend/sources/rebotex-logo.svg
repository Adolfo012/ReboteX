<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="ReboteX Logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
  </defs>
  <!-- Fondo con esquinas redondeadas -->
  <rect x="8" y="8" width="112" height="112" rx="22" fill="url(#bg)"/>

  <!-- Balón de baloncesto estilizado (sin X ni línea inferior) -->
