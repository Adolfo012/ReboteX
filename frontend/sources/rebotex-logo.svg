  <!-- Líneas del balón -->
  <path d="M34 64h60" stroke="#ffffff" stroke-width="4" fill="none" opacity="0.95"/>
  <path d="M64 34v60" stroke="#ffffff" stroke-width="4" fill="none" opacity="0.95"/>
  <path d="M46 44c10 8 10 32 0 40" stroke="#ffffff" stroke-width="4" fill="none" opacity="0.95"/>
  <path d="M82 44c-10 8-10 32 0 40" stroke="#ffffff" stroke-width="4" fill="none" opacity="0.95"/>
</svg>